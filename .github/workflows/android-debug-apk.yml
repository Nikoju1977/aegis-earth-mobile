name: Android Debug APK
on:
  push:
    branches: [main]
    paths:
      - index.html
      - sw.js
      - manifest.webmanifest
      - icon.svg
      - www/**
      - package.json
      - capacitor.config.json
      - scripts/**
      - tests/**
      - .github/workflows/android-debug-apk.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android command-line tools are missing at $SDK_ROOT"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Synchronize one web source for Android and test
        run: |
          npm run sync:web
          npm run check:web
          npm test
      - name: Generate Android Capacitor project
        run: npx cap add android
      - name: Synchronize Capacitor project
        run: npm run android:sync
      - name: Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-earth-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
